# HAOS-to-iCloud backup plugin. Activation requires HAOS tokens and rclone.
enabled: false
rclone_binary: /usr/bin/rclone
rclone_config_path: /etc/ohana-agent/rclone.conf
rclone_remote: icloud:Ohana/Backups
environment_file: /etc/ohana-agent/backup.env
temporary_directory: /run/ohana-agent/backup
require_tmpfs: true
chunk_size_bytes: 1048576
infra_01:
  enabled: false
  schedule: "0 1 * * *"
  age_binary: /usr/bin/age
  age_recipient_file: /etc/ohana-agent/keys/infra-01.agepub
  age_identity_file: /etc/ohana-agent/keys/infra-01.agekey
  recovery_remote_path: icloud:Ohana/Recovery/infra-01.agekey
  remote_retention_count: 0
targets: []
