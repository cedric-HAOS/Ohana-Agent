# Home Assistant telemetry plugin configuration.
# Entity mappings are declared as services of type home_assistant_telemetry
# in infrastructure.yaml. Existing shelly_telemetry services are migrated
# transparently by Agent 1.9.0.
enabled: true
timeout: 5.0
retries: 1
interval_seconds: 300
maximum_age_seconds: 900
home_assistant_url: http://ha-green.ohana.lan:8123
access_token: null
access_token_environment_variable: OHANA_HOME_ASSISTANT_TOKEN
verify_tls: true
