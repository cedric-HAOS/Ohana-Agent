# -----------------------------------------------------------------------------
# Ohana-Agent
# Example application configuration
# -----------------------------------------------------------------------------

version: 1

agent:
  name: Shikamaru
  environment: production

mqtt:
  host: localhost
  port: 1883
  client_id: ohana-agent
  keepalive_seconds: 60
  authentication:
    username: null
    password: null

logging:
  level: INFO

health:
  enabled: true
  interval_seconds: 30

plugins:
  enabled: true
  directory: plugins

vision:
  enabled: true
  observation_url: http://127.0.0.1:8000/api/observations
  infrastructure_url: http://127.0.0.1:8000/api/infrastructure
  timeout_seconds: 5.0
  infrastructure_retry_seconds: 10.0
  infrastructure_refresh_seconds: 300.0
  outbox_path: /var/lib/ohana-agent/vision-outbox.db
  outbox_retry_seconds: 10.0
  outbox_max_entries: 50000

administration:
  enabled: true
  host: 127.0.0.1
  port: 8765
  token_file: /etc/ohana-agent/management.token
  companion:
    enabled: true
    host: 0.0.0.0
    port: 8767
    certificate_file: /etc/ohana-agent/tls/worker.crt
    private_key_file: /etc/ohana-agent/tls/worker.key
    ca_certificate_file: /etc/ohana-agent/tls/ca.crt
    credential_ttl_days: 90
    push:
      enabled: false
      environment: production
      team_id: null
      key_id: null
      bundle_id: fr.ohana.Shizune
      private_key_file: /etc/ohana-agent/shizune-apns.p8
      timeout_seconds: 5.0
  jobs:
    enabled: false
    database_path: /var/lib/ohana-agent/distributed-jobs.db
    worker_token_file: /etc/ohana-agent/katsuyu.token
    lease_seconds: 60
    waiting_worker_after_seconds: 30
    retention_days: 30
    max_active_jobs: 1000
    logs:
      enabled: false
      schedule: "0 5 * * *"
      sources:
        - ha-01
        - linky-01
        - zwave-01
      window_hours: 24
      max_bytes_per_source: 2097152
      timeout_seconds: 900
    wake_on_lan:
      enabled: false
      broadcast_address: 192.168.1.255
      port: 9
      wait_timeout_seconds: 180
      available_for_seconds: 30
    worker_tls:
      enabled: false
      host: 0.0.0.0
      port: 8766
      certificate_file: /etc/ohana-agent/tls/worker.crt
      private_key_file: /etc/ohana-agent/tls/worker.key
      ca_certificate_file: /etc/ohana-agent/tls/ca.crt
  network:
    enabled: false
    helper_path: /usr/local/sbin/ohana-network-helper
    sudo_path: /usr/bin/sudo
    rollback_seconds: 90
  dhcp:
    enabled: true
    server_node_id: infra-01
    main_config_path: /etc/dnsmasq.d/00-ohana.conf
    infrastructure_reservations_path: /etc/dnsmasq.d/10-infrastructure.conf
    server_reservations_path: /etc/dnsmasq.d/20-serveurs.conf
    network_reservations_path: /etc/dnsmasq.d/30-infrastructure-reseau.conf
    home_automation_reservations_path: /etc/dnsmasq.d/40-passerelles-domotiques.conf
    critical_reservations_path: /etc/dnsmasq.d/50-equipements-critiques.conf
    leases_path: /var/lib/misc/dnsmasq.leases
    validation_command:
      - /usr/sbin/dnsmasq
      - --test
    reload_request_path: /run/ohana-agent/dhcp-reload.request
